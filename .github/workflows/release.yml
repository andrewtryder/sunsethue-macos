name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

# macOS binaries are intentionally built locally to avoid GitHub macOS runner usage
# and because the public distribution is an unsigned universal DMG.
# After Release Please creates a tag/release, run: ./scripts/release-local.sh vX.Y.Z
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
