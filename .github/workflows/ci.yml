name: CI

# Default CI is intentionally lightweight: one macOS job (package tests, project
# drift, metadata) plus one cheap Linux job (secret scan). Expensive work
# (universal build, DMG packaging, Intel runtime, sanitizers) lives in
# ci-extended.yml and runs manually or weekly. No signing identity, provisioning
# profile, or notarization is required anywhere.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Package tests and project checks
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [[ -d /Applications/Xcode.app ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            latest="$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -V | tail -1)"
            sudo xcode-select -s "${latest}/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated Xcode project matches commit
        run: git diff --exit-code -- SunsetHue.xcodeproj

      - name: Verify version metadata
        run: python3 scripts/verify_release_metadata.py

      - name: Run package tests
        run: swift test --package-path .

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for accidental secrets
        run: |
          set -euo pipefail
          command -v rg >/dev/null 2>&1 || sudo apt-get install -y ripgrep
          if rg -n --hidden \
            -g '!**/Fixtures/**' -g '!**/.git/**' -g '!**/build/**' -g '!**/.build/**' -g '!**/DerivedData/**' \
            -e 'x-api-key:\s*[A-Za-z0-9_-]{20,}' \
            -e 'SUNSETHUE_API_KEY\s*=\s*['\''"][^'\''"]+['\''"]' \
            -e 'sk_live_[A-Za-z0-9]+' \
            . ; then
            echo "Potential secret pattern found" >&2
            exit 1
          fi
          echo "Secret scan passed"
