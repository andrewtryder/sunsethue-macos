name: CI

# CI runs the full quality gate on every push and PR: formatting (SwiftFormat),
# linting (SwiftLint), package tests, an unsigned application build, XcodeGen
# project sync, release metadata, and shell syntax. No signing identity,
# provisioning profile, or notarization is required anywhere. Expensive extra
# work (universal build, DMG packaging, sanitizers) remains local-only via
# scripts/package-unsigned.sh.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/commitlint.yml'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/commitlint.yml'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Quality gate, tests, and unsigned build
    if: |
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.head_ref, 'release-please--') &&
      !startsWith(github.event.head_commit.message, 'chore: release') &&
      !startsWith(github.event.pull_request.title, 'chore: release')
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          if [[ -d /Applications/Xcode.app ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            latest="$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -V | tail -1)"
            sudo xcode-select -s "${latest}/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Install tooling
        # Version- and SHA-256-pinned official GitHub Release archives avoid
        # Homebrew overhead and formula drift between local checks and CI.
        run: |
          set -euo pipefail
          TOOLS_DIR="${RUNNER_TEMP}/sunsethue-tools"
          BIN_DIR="${TOOLS_DIR}/bin"
          mkdir -p "${BIN_DIR}" "${TOOLS_DIR}/swiftlint" "${TOOLS_DIR}/swiftformat"

          XCODEGEN_VERSION="2.47.0"
          XCODEGEN_SHA256="6ef12a3ef5327c2c713397f46d9160550f8b1cdc5c925cd884d65c77c9f696cd"
          SWIFTLINT_VERSION="0.65.1"
          SWIFTLINT_SHA256="c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"
          SWIFTFORMAT_VERSION="0.64.7"
          SWIFTFORMAT_SHA256="e82e224325cbd3403fc7b68caf6c917926dc106de3af875fca4b87e3c4634038"

          curl -fsSL -o "${TOOLS_DIR}/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          curl -fsSL -o "${TOOLS_DIR}/portable_swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          curl -fsSL -o "${TOOLS_DIR}/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"

          printf '%s  %s\n' "${XCODEGEN_SHA256}" "${TOOLS_DIR}/xcodegen.zip" | shasum -a 256 --check
          printf '%s  %s\n' "${SWIFTLINT_SHA256}" "${TOOLS_DIR}/portable_swiftlint.zip" | shasum -a 256 --check
          printf '%s  %s\n' "${SWIFTFORMAT_SHA256}" "${TOOLS_DIR}/swiftformat.zip" | shasum -a 256 --check

          unzip -q "${TOOLS_DIR}/xcodegen.zip" -d "${TOOLS_DIR}"
          unzip -q "${TOOLS_DIR}/portable_swiftlint.zip" -d "${TOOLS_DIR}/swiftlint"
          unzip -q "${TOOLS_DIR}/swiftformat.zip" -d "${TOOLS_DIR}/swiftformat"

          chmod +x "${TOOLS_DIR}/xcodegen/bin/xcodegen" "${TOOLS_DIR}/swiftlint/swiftlint" "${TOOLS_DIR}/swiftformat/swiftformat"
          ln -sf "${TOOLS_DIR}/swiftlint/swiftlint" "${BIN_DIR}/swiftlint"
          ln -sf "${TOOLS_DIR}/swiftformat/swiftformat" "${BIN_DIR}/swiftformat"

          XCODEGEN_BIN="${TOOLS_DIR}/xcodegen/bin"
          echo "${BIN_DIR}" >> "${GITHUB_PATH}"
          echo "${XCODEGEN_BIN}" >> "${GITHUB_PATH}"
          export PATH="${BIN_DIR}:${XCODEGEN_BIN}:${PATH}"

          if [[ "$(swiftformat --version)" != "${SWIFTFORMAT_VERSION}" ]]; then
            echo "Expected SwiftFormat ${SWIFTFORMAT_VERSION}, got $(swiftformat --version)." >&2
            exit 1
          fi
          if [[ "$(swiftlint version)" != "${SWIFTLINT_VERSION}" ]]; then
            echo "Expected SwiftLint ${SWIFTLINT_VERSION}, got $(swiftlint version)." >&2
            exit 1
          fi
          xcodegen --version

      - name: SwiftFormat (lint only)
        run: swiftformat --lint .

      - name: SwiftLint (strict)
        run: swiftlint lint --strict --quiet

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated Xcode project matches commit
        run: git diff --exit-code -- SunsetHue.xcodeproj

      - name: Verify version metadata
        run: python3 scripts/verify_release_metadata.py

      - name: Run package tests
        run: swift test

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -scheme SunsetHue \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData-ci-unsigned \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            build

      - name: Verify built app bundle
        run: |
          APP="build/DerivedData-ci-unsigned/Build/Products/Debug/SunsetHue.app"
          test -d "$APP"
          test -x "$APP/Contents/MacOS/SunsetHue"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          echo "App bundle present and executable."

  fast-checks:
    name: Fast static checks (secrets and shell syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan for accidental secrets
        run: |
          set -euo pipefail
          command -v rg >/dev/null 2>&1 || sudo apt-get install -y ripgrep
          if rg -n --hidden \
            -g '!**/Fixtures/**' -g '!**/.git/**' -g '!**/build/**' -g '!**/.build/**' -g '!**/DerivedData/**' \
            -e 'x-api-key:\s*[A-Za-z0-9_-]{20,}' \
            -e 'SUNSETHUE_API_KEY\s*=\s*['\''"][^'\''"]+['\''"]' \
            -e 'sk_live_[A-Za-z0-9]+' \
            . ; then
            echo "Potential secret pattern found" >&2
            exit 1
          fi
          echo "Secret scan passed"

      - name: Shell syntax checks
        run: |
          set -euo pipefail
          for sh in $(find scripts -name '*.sh' -type f); do
            bash -n "$sh"
            echo "OK $sh"
          done
