name: CI Extended

# Expensive macOS validation. Runs only on demand or weekly to save runner
# minutes. All builds are unsigned (CODE_SIGNING_ALLOWED=NO); no Apple Developer
# account is needed.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC

permissions:
  contents: read

concurrency:
  group: ci-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-build:
    name: Unsigned build (${{ matrix.purpose }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            purpose: current-runtime
          - os: macos-15-intel
            purpose: intel-runtime

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [[ -d /Applications/Xcode.app ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            latest="$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -V | tail -1)"
            sudo xcode-select -s "${latest}/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated Xcode project matches commit
        run: git diff --exit-code -- SunsetHue.xcodeproj

      - name: Verify version metadata
        run: python3 scripts/verify_release_metadata.py

      - name: Run package tests
        run: swift test --package-path .

      - name: Build Release (universal, unsigned)
        run: |
          xcodebuild \
            -scheme SunsetHue \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -configuration Release \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            build

      - name: Verify universal binaries
        run: |
          APP="build/DerivedData/Build/Products/Release/SunsetHue.app"
          test -d "$APP"
          ARCHS_APP="$(lipo -archs "$APP/Contents/MacOS/SunsetHue")"
          test "$ARCHS_APP" = "x86_64 arm64" -o "$ARCHS_APP" = "arm64 x86_64"
          WIDGET="$APP/Contents/PlugIns/SunsetHueWidget.appex/Contents/MacOS/SunsetHueWidget"
          ARCHS_WIDGET="$(lipo -archs "$WIDGET")"
          test "$ARCHS_WIDGET" = "x86_64 arm64" -o "$ARCHS_WIDGET" = "arm64 x86_64"
          echo "App: $ARCHS_APP"
          echo "Widget: $ARCHS_WIDGET"

      - name: Smoke launch Release app
        run: |
          chmod +x scripts/smoke-launch.sh
          ./scripts/smoke-launch.sh build/DerivedData/Build/Products/Release/SunsetHue.app

      - name: Package unsigned DMG and assert widget stripped
        run: |
          chmod +x scripts/package-unsigned.sh
          ./scripts/package-unsigned.sh
          MOUNT="$(mktemp -d /tmp/sunsethue-dmg.XXXXXX)"
          hdiutil attach -nobrowse -readonly -mountpoint "${MOUNT}" dist/SunsetHue-macos-unsigned.dmg
          test -d "${MOUNT}/SunsetHue.app"
          test ! -d "${MOUNT}/SunsetHue.app/Contents/PlugIns/SunsetHueWidget.appex"
          hdiutil detach "${MOUNT}"
          rmdir "${MOUNT}"
          echo "Unsigned DMG has no widget appex"

  thread-sanitizer:
    name: Package Tests (TSan)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [[ -d /Applications/Xcode.app ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            latest="$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -V | tail -1)"
            sudo xcode-select -s "${latest}/Contents/Developer"
          fi

      - name: Run package tests with Thread Sanitizer
        run: swift test --package-path . --sanitize=thread

  address-sanitizer:
    name: Package Tests (ASan)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [[ -d /Applications/Xcode.app ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            latest="$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -V | tail -1)"
            sudo xcode-select -s "${latest}/Contents/Developer"
          fi

      - name: Run package tests with Address Sanitizer
        run: swift test --package-path . --sanitize=address
